<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>~/rathish — Backend Engineer</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2264%22%20height%3D%2264%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%230b0d11%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%2211%22%20width%3D%2242%22%20height%3D%2242%22%20rx%3D%228%22%20fill%3D%22none%22%20stroke%3D%22%232a3140%22%20stroke-width%3D%221.5%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2242%22%20font-family%3D%22monospace%22%20font-size%3D%2226%22%20font-weight%3D%22700%22%20fill%3D%22%233b82f6%22%20text-anchor%3D%22middle%22%3E~%2F%3C%2Ftext%3E%3C%2Fsvg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
<style>
/* ===== COLORS ===== */
:root {
  --neutral-950:#08090b; --neutral-925:#0b0d11; --neutral-900:#0e1117;
  --neutral-850:#13161d; --neutral-800:#181c25; --neutral-750:#1f242f;
  --neutral-700:#2a3140; --neutral-600:#3a4253; --neutral-500:#5c6573;
  --neutral-400:#7d8796; --neutral-300:#9aa4b2; --neutral-200:#c3cad6;
  --neutral-100:#e6e9ef; --neutral-050:#f4f6fa;
  --blue-700:#1d4ed8; --blue-600:#2563eb; --blue-500:#3b82f6;
  --blue-400:#60a5fa; --blue-300:#93c5fd;
  --blue-glow:rgba(59,130,246,0.16); --blue-glow-strong:rgba(59,130,246,0.32); --blue-tint:rgba(59,130,246,0.10);
  --term-green:#3fb950; --term-cyan:#56d4dd; --term-amber:#d29922; --term-red:#f85149; --term-purple:#bc8cff;
  --surface-page:var(--neutral-925); --surface-base:var(--neutral-900); --surface-raised:var(--neutral-850);
  --surface-card:var(--neutral-800); --surface-hover:var(--neutral-750); --surface-inset:var(--neutral-950);
  --text-primary:var(--neutral-100); --text-secondary:var(--neutral-300); --text-tertiary:var(--neutral-400);
  --text-muted:var(--neutral-500); --text-bright:var(--neutral-050); --text-on-accent:#ffffff;
  --border-subtle:var(--neutral-600); --border-default:var(--neutral-700); --border-strong:var(--neutral-500); --border-accent:var(--blue-500);
  --accent:var(--blue-500); --accent-hover:var(--blue-400); --accent-active:var(--blue-600);
  --accent-muted:var(--blue-tint); --accent-text:var(--blue-400);
  --status-online:var(--term-green); --status-warn:var(--term-amber); --status-error:var(--term-red);
  --selection-bg:var(--blue-glow-strong);
}
::selection { background:var(--selection-bg); color:var(--text-bright); }

/* ===== TYPOGRAPHY ===== */
:root {
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --font-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --text-2xs:11px; --text-xs:12px; --text-sm:13px; --text-base:15px; --text-md:17px;
  --text-lg:20px; --text-xl:25px; --text-2xl:32px; --text-3xl:42px; --text-4xl:56px; --text-5xl:76px;
  --weight-regular:400; --weight-medium:500; --weight-semibold:600; --weight-bold:700;
  --leading-tight:1.05; --leading-snug:1.25; --leading-normal:1.5; --leading-relaxed:1.7;
  --tracking-tight:-0.02em; --tracking-normal:0; --tracking-wide:0.04em; --tracking-wider:0.12em;
  --font-display:var(--font-mono); --font-heading:var(--font-mono);
  --font-body:var(--font-sans); --font-label:var(--font-mono); --font-code:var(--font-mono);
}

/* ===== SPACING & LAYOUT ===== */
:root {
  --space-0:0; --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px; --space-16:64px;
  --space-20:80px; --space-24:96px; --space-32:128px;
  --radius-xs:3px; --radius-sm:5px; --radius-md:8px; --radius-lg:12px; --radius-pill:999px;
  --border-width:1px; --border-width-thick:2px;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.4); --shadow-md:0 4px 16px rgba(0,0,0,0.45); --shadow-lg:0 16px 48px rgba(0,0,0,0.55);
  --shadow-inset:inset 0 1px 0 rgba(255,255,255,0.04);
  --glow-accent:0 0 0 1px var(--blue-500),0 0 24px var(--blue-glow);
  --glow-focus:0 0 0 2px var(--surface-page),0 0 0 4px var(--blue-500);
  --container-max:1080px; --container-wide:1280px; --section-pad-y:var(--space-24); --gutter:var(--space-6);
  --ease-out:cubic-bezier(0.16,1,0.3,1); --ease-std:cubic-bezier(0.4,0,0.2,1);
  --dur-fast:120ms; --dur-med:220ms; --dur-slow:400ms;
}

/* ===== BASE ===== */
*,*::before,*::after { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  margin:0; background:var(--surface-page); color:var(--text-primary);
  font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(255,255,255,0.022) 1px,transparent 1px);
  background-size:28px 28px;
}
a { color:inherit; }
::-webkit-scrollbar { width:10px; }
::-webkit-scrollbar-thumb { background:var(--neutral-700); border-radius:999px; }
::-webkit-scrollbar-track { background:var(--surface-page); }
html { overflow-x:hidden; }
body { overflow-x:hidden; }
@keyframes rds-blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

/* ===== NAV (mobile) ===== */
.rds-nav-toggle {
  display:none; align-items:center; justify-content:center;
  width:36px; height:36px; flex:none;
  background:none; border:1px solid var(--border-default); border-radius:var(--radius-sm);
  color:var(--text-primary); font-family:var(--font-mono); font-size:var(--text-md);
  cursor:pointer;
}
.rds-nav-links { display:flex; align-items:center; }

/* ===== RESPONSIVE ===== */
@media (max-width:860px) {
  .rds-hero-grid, .rds-two-col { grid-template-columns:1fr !important; }
  .rds-hero-grid { gap:var(--space-10) !important; }
  h1 { font-size:var(--text-3xl) !important; }
}

@media (max-width:700px) {
  .rds-navbar { padding:14px var(--space-4) !important; position:relative; }
  .rds-nav-toggle { display:inline-flex !important; }
  .rds-nav-links {
    display:none;
    position:absolute; top:100%; left:0; right:0;
    flex-direction:column; align-items:flex-start;
    background:var(--surface-raised);
    border-bottom:1px solid var(--border-default);
    box-shadow:var(--shadow-md);
    padding:var(--space-4) var(--space-6);
    gap:var(--space-4) !important;
    z-index:60;
  }
  .rds-nav-links.rds-nav-open { display:flex; }
  .rds-nav-links a { width:100%; }
  .rds-nav-links > span { width:100%; flex-direction:column !important; align-items:stretch !important; gap:var(--space-2) !important; }
}

@media (max-width:480px) {
  section#top { padding:72px var(--gutter) 48px !important; }
  section { padding-top:var(--space-16) !important; padding-bottom:var(--space-16) !important; }
  h1 { font-size:var(--text-2xl) !important; }
  h2 { font-size:var(--text-xl) !important; }
  .rds-hero-stats { gap:var(--space-6) !important; }
}

@media (max-width:400px) {
  .rds-projects-grid, .rds-skills-grid { grid-template-columns:1fr !important; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- ===== DESIGN SYSTEM BUNDLE ===== -->
<script type="text/babel">
function Badge({ tone="neutral", dot=false, children, style, ...rest }) {
  const tones = {
    neutral:{ color:"var(--text-tertiary)", dotColor:"var(--text-muted)" },
    online: { color:"var(--term-green)",    dotColor:"var(--term-green)"  },
    accent: { color:"var(--accent-text)",   dotColor:"var(--accent)"      },
    warn:   { color:"var(--term-amber)",    dotColor:"var(--term-amber)"  },
  };
  const t = tones[tone] || tones.neutral;
  return (
    <span {...rest} style={{ display:"inline-flex", alignItems:"center", gap:"7px", padding:"3px 10px 3px 9px", fontFamily:"var(--font-mono)", fontSize:"var(--text-2xs)", fontWeight:"var(--weight-medium)", letterSpacing:"var(--tracking-wide)", textTransform:"uppercase", lineHeight:1.4, borderRadius:"var(--radius-pill)", border:"1px solid var(--border-default)", background:"var(--surface-raised)", color:t.color, ...style }}>
      {dot && <span style={{ width:"6px", height:"6px", borderRadius:"50%", background:t.dotColor, boxShadow:tone==="online"?"0 0 8px var(--term-green)":"none", flex:"none" }} />}
      {children}
    </span>
  );
}

function Button({ variant="primary", size="md", as="button", icon=null, iconRight=null, children, style, ...rest }) {
  const sizes = {
    sm:{ padding:"6px 12px",  fontSize:"var(--text-xs)",   height:"30px", gap:"6px"  },
    md:{ padding:"9px 18px",  fontSize:"var(--text-sm)",   height:"38px", gap:"8px"  },
    lg:{ padding:"13px 24px", fontSize:"var(--text-base)", height:"48px", gap:"10px" },
  };
  const variants = {
    primary:  { background:"var(--accent)",       color:"var(--text-on-accent)", border:"1px solid var(--accent)",        boxShadow:"0 0 0 0 var(--blue-glow)" },
    secondary:{ background:"var(--surface-card)", color:"var(--text-primary)",   border:"1px solid var(--border-default)" },
    ghost:    { background:"transparent",         color:"var(--text-secondary)", border:"1px solid transparent"          },
    outline:  { background:"transparent",         color:"var(--accent-text)",    border:"1px solid var(--border-accent)"  },
  };
  const Comp = as;
  const s = sizes[size] || sizes.md;
  const v = variants[variant] || variants.primary;
  return (
    <Comp {...rest} style={{ display:"inline-flex", alignItems:"center", justifyContent:"center", gap:s.gap, height:s.height, padding:s.padding, fontFamily:"var(--font-mono)", fontSize:s.fontSize, fontWeight:"var(--weight-medium)", letterSpacing:"0.01em", lineHeight:1, borderRadius:"var(--radius-sm)", cursor:"pointer", textDecoration:"none", whiteSpace:"nowrap", transition:"background var(--dur-fast) var(--ease-std),border-color var(--dur-fast) var(--ease-std),color var(--dur-fast) var(--ease-std),box-shadow var(--dur-med) var(--ease-out)", ...v, ...style }}
      onMouseEnter={(e)=>{
        if(variant==="primary")   { e.currentTarget.style.background="var(--accent-hover)"; e.currentTarget.style.borderColor="var(--accent-hover)"; e.currentTarget.style.boxShadow="0 0 24px var(--blue-glow)"; }
        else if(variant==="secondary"){ e.currentTarget.style.background="var(--surface-hover)"; e.currentTarget.style.borderColor="var(--border-strong)"; }
        else if(variant==="ghost")    { e.currentTarget.style.color="var(--text-primary)"; e.currentTarget.style.background="var(--surface-raised)"; }
        else if(variant==="outline")  { e.currentTarget.style.background="var(--accent-muted)"; e.currentTarget.style.color="var(--accent-hover)"; }
        rest.onMouseEnter && rest.onMouseEnter(e);
      }}
      onMouseLeave={(e)=>{
        Object.assign(e.currentTarget.style,{ background:v.background, color:v.color, borderColor:v.border.split(" ").slice(2).join(" "), boxShadow:v.boxShadow||"none" });
        rest.onMouseLeave && rest.onMouseLeave(e);
      }}
    >{icon}{children}{iconRight}</Comp>
  );
}

function Cursor({ color="var(--accent)", height="1em", width="0.5em", style, ...rest }) {
  return (
    <span {...rest} className={"rds-cursor "+(rest.className||"")} style={{ display:"inline-block", width, height, background:color, marginLeft:"2px", verticalAlign:"text-bottom", animation:"rds-blink 1.1s steps(1) infinite", ...style }} />
  );
}

function SectionLabel({ prefix="//", children, color="var(--accent-text)", style, ...rest }) {
  return (
    <div {...rest} style={{ display:"inline-flex", alignItems:"center", gap:"10px", fontFamily:"var(--font-mono)", fontSize:"var(--text-xs)", fontWeight:"var(--weight-medium)", letterSpacing:"var(--tracking-wider)", textTransform:"uppercase", color:"var(--text-tertiary)", ...style }}>
      <span style={{ color, fontWeight:"var(--weight-semibold)" }}>{prefix}</span>
      {children}
    </div>
  );
}

function StatBlock({ value, label, accent=false, style, ...rest }) {
  return (
    <div {...rest} style={{ display:"flex", flexDirection:"column", gap:"6px", ...style }}>
      <span style={{ fontFamily:"var(--font-mono)", fontSize:"var(--text-2xl)", fontWeight:"var(--weight-semibold)", lineHeight:1, letterSpacing:"var(--tracking-tight)", color:accent?"var(--accent-text)":"var(--text-bright)" }}>{value}</span>
      <span style={{ fontFamily:"var(--font-mono)", fontSize:"var(--text-2xs)", letterSpacing:"var(--tracking-wide)", textTransform:"uppercase", color:"var(--text-muted)" }}>{label}</span>
    </div>
  );
}

function Tag({ variant="default", children, style, ...rest }) {
  const variants = {
    default:{ background:"var(--surface-raised)", color:"var(--text-secondary)", borderColor:"var(--border-default)" },
    accent: { background:"var(--accent-muted)",   color:"var(--accent-text)",    borderColor:"rgba(59,130,246,0.35)" },
    solid:  { background:"var(--surface-card)",   color:"var(--text-primary)",   borderColor:"var(--border-strong)"  },
  };
  const v = variants[variant] || variants.default;
  return (
    <span {...rest} style={{ display:"inline-flex", alignItems:"center", gap:"6px", padding:"4px 10px", fontFamily:"var(--font-mono)", fontSize:"var(--text-xs)", fontWeight:"var(--weight-medium)", lineHeight:1.4, borderRadius:"var(--radius-xs)", border:"1px solid", ...v, ...style }}>
      {children}
    </span>
  );
}

function TerminalWindow({ title="bash", dots=true, children, bodyStyle, style, ...rest }) {
  return (
    <div {...rest} style={{ background:"var(--surface-base)", border:"1px solid var(--border-default)", borderRadius:"var(--radius-md)", overflow:"hidden", boxShadow:"var(--shadow-md)", ...style }}>
      <div style={{ display:"flex", alignItems:"center", gap:"10px", padding:"10px 14px", background:"var(--surface-raised)", borderBottom:"1px solid var(--border-default)" }}>
        {dots && (
          <div style={{ display:"flex", gap:"7px" }}>
            {["#3a4253","#3a4253","#3a4253"].map((c,i)=><span key={i} style={{ width:"11px", height:"11px", borderRadius:"50%", background:c }} />)}
          </div>
        )}
        <span style={{ fontFamily:"var(--font-mono)", fontSize:"var(--text-xs)", color:"var(--text-muted)", letterSpacing:"0.02em", marginLeft:dots?"4px":0 }}>{title}</span>
      </div>
      <div style={{ padding:"var(--space-6)", fontFamily:"var(--font-mono)", ...bodyStyle }}>{children}</div>
    </div>
  );
}

function NavBar({ brand="~/rathish", links=[], cta=null, active, style, ...rest }) {
  const [open, setOpen] = React.useState(false);
  React.useEffect(() => { setOpen(false); }, [active]);
  return (
    <header {...rest} className="rds-navbar" style={{ position:"sticky", top:0, zIndex:50, display:"flex", alignItems:"center", justifyContent:"space-between", gap:"var(--space-6)", padding:"14px var(--space-8)", background:"rgba(11,13,17,0.72)", backdropFilter:"blur(12px)", WebkitBackdropFilter:"blur(12px)", borderBottom:"1px solid var(--border-default)", ...style }}>
      <a href="#top" style={{ fontFamily:"var(--font-mono)", fontSize:"var(--text-sm)", fontWeight:"var(--weight-semibold)", color:"var(--text-bright)", textDecoration:"none", letterSpacing:"0.01em" }}>
        <span style={{ color:"var(--accent-text)" }}>{brand.split("/")[0]}/</span>
        {brand.split("/").slice(1).join("/")}
      </a>
      <button
        type="button"
        className="rds-nav-toggle"
        aria-label={open?"Close menu":"Open menu"}
        aria-expanded={open}
        onClick={()=>setOpen((o)=>!o)}
      >
        {open ? "✕" : "☰"}
      </button>
      <nav className={"rds-nav-links"+(open?" rds-nav-open":"")} style={{ gap:"var(--space-6)" }}>
        {links.map((l)=>{
          const isActive = active===l.id || active===l.label;
          return (
            <a key={l.label} href={l.href} onClick={()=>setOpen(false)} style={{ fontFamily:"var(--font-mono)", fontSize:"var(--text-xs)", letterSpacing:"0.02em", textDecoration:"none", color:isActive?"var(--accent-text)":"var(--text-tertiary)", transition:"color var(--dur-fast) var(--ease-std)" }}
              onMouseEnter={(e)=>(e.currentTarget.style.color="var(--text-primary)")}
              onMouseLeave={(e)=>(e.currentTarget.style.color=isActive?"var(--accent-text)":"var(--text-tertiary)")}
            >{l.label}</a>
          );
        })}
        {cta}
      </nav>
    </header>
  );
}

function ExperienceItem({ role, company, period, current=false, bullets=[], stack=[], style, ...rest }) {
  return (
    <div {...rest} style={{ position:"relative", paddingLeft:"var(--space-8)", paddingBottom:"var(--space-8)", borderLeft:"1px solid var(--border-default)", ...style }}>
      <span style={{ position:"absolute", left:"-6px", top:"4px", width:"11px", height:"11px", borderRadius:"50%", background:current?"var(--accent)":"var(--surface-card)", border:"2px solid "+(current?"var(--accent)":"var(--border-strong)"), boxShadow:current?"0 0 12px var(--blue-glow-strong)":"none" }} />
      <div style={{ display:"flex", flexWrap:"wrap", alignItems:"center", gap:"10px", marginBottom:"4px" }}>
        <h3 style={{ margin:0, fontFamily:"var(--font-mono)", fontSize:"var(--text-md)", fontWeight:"var(--weight-semibold)", color:"var(--text-bright)" }}>{role}</h3>
        {current && <Badge tone="online" dot>Present</Badge>}
      </div>
      <div style={{ display:"flex", flexWrap:"wrap", gap:"10px", fontFamily:"var(--font-mono)", fontSize:"var(--text-xs)", color:"var(--text-tertiary)", marginBottom:"var(--space-4)" }}>
        <span style={{ color:"var(--accent-text)" }}>{company}</span>
        <span style={{ color:"var(--text-muted)" }}>{period}</span>
      </div>
      {bullets.length>0 && (
        <ul style={{ margin:"0 0 var(--space-4)", padding:0, listStyle:"none", display:"flex", flexDirection:"column", gap:"8px" }}>
          {bullets.map((b,i)=>(
            <li key={i} style={{ display:"flex", gap:"10px", fontFamily:"var(--font-body)", fontSize:"var(--text-sm)", lineHeight:"var(--leading-normal)", color:"var(--text-secondary)" }}>
              <span style={{ color:"var(--accent-text)", fontFamily:"var(--font-mono)", flex:"none" }}>›</span>
              <span>{b}</span>
            </li>
          ))}
        </ul>
      )}
      {stack.length>0 && (
        <div style={{ display:"flex", flexWrap:"wrap", gap:"6px" }}>
          {stack.map((t)=><Tag key={t}>{t}</Tag>)}
        </div>
      )}
    </div>
  );
}

function ProjectCard({ name, description, stack=[], href, year, solo=false, style, ...rest }) {
  const [hover,setHover] = React.useState(false);
  return (
    <div {...rest}
      onMouseEnter={(e)=>{ setHover(true); rest.onMouseEnter&&rest.onMouseEnter(e); }}
      onMouseLeave={(e)=>{ setHover(false); rest.onMouseLeave&&rest.onMouseLeave(e); }}
      style={{ display:"flex", flexDirection:"column", gap:"var(--space-4)", background:"var(--surface-card)", border:"1px solid "+(hover?"var(--border-strong)":"var(--border-default)"), borderRadius:"var(--radius-md)", padding:"var(--space-6)", boxShadow:hover?"var(--shadow-md),0 0 0 1px var(--blue-glow)":"var(--shadow-sm)", transition:"border-color var(--dur-med) var(--ease-std),box-shadow var(--dur-med) var(--ease-out)", ...style }}
    >
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <span style={{ fontFamily:"var(--font-mono)", fontSize:"var(--text-2xs)", letterSpacing:"var(--tracking-wide)", color:"var(--text-muted)" }}>
          {href ? "~/"+href.replace(/^https?:\/\//,"").split("/")[0] : "~/project"}
        </span>
        {(year||solo) && (
          <span style={{ display:"flex", alignItems:"center", gap:"8px", fontFamily:"var(--font-mono)", fontSize:"var(--text-2xs)", color:"var(--text-muted)" }}>
            {solo && <span style={{ color:"var(--term-green)", letterSpacing:"0.06em" }}>SOLO</span>}
            {year && <span>{year}</span>}
          </span>
        )}
      </div>
      <div style={{ display:"flex", alignItems:"center", gap:"10px" }}>
        <h3 style={{ margin:0, fontFamily:"var(--font-mono)", fontSize:"var(--text-lg)", fontWeight:"var(--weight-semibold)", letterSpacing:"var(--tracking-tight)", color:hover?"var(--accent-text)":"var(--text-bright)", transition:"color var(--dur-med) var(--ease-std)" }}>{name}</h3>
        {href && <span style={{ fontFamily:"var(--font-mono)", color:"var(--accent-text)", fontSize:"var(--text-base)", transform:hover?"translate(2px,-2px)":"none", transition:"transform var(--dur-med) var(--ease-out)" }}>↗</span>}
      </div>
      <p style={{ margin:0, fontFamily:"var(--font-body)", fontSize:"var(--text-sm)", lineHeight:"var(--leading-relaxed)", color:"var(--text-secondary)", flex:1 }}>{description}</p>

<script type="text/babel">
function App() {
  const { NavBar, Button } = window.RathishPortfolioDesignSystem_2eb0e9;
  const [active,setActive] = React.useState("about");
  const ids = ["about","work","projects","skills","contact"];

  React.useEffect(()=>{
    const obs = new IntersectionObserver(
      (entries)=>{ entries.forEach((e)=>{ if(e.isIntersecting) setActive(e.target.id); }); },
      { rootMargin:"-45% 0px -50% 0px", threshold:0 }
    );
    ids.forEach((id)=>{ const el=document.getElementById(id); if(el) obs.observe(el); });
    return ()=>obs.disconnect();
  },[]);

  return (
    <div>
      <NavBar
        brand="~/rathish"
        active={active}
        links={[
          { id:"about",    label:"about",    href:"#about"    },
          { id:"work",     label:"work",     href:"#work"     },
          { id:"projects", label:"projects", href:"#projects" },
          { id:"skills",   label:"skills",   href:"#skills"   },
          { id:"contact",  label:"contact",  href:"#contact"  },
        ]}
        cta={<span style={{ display:"flex", flexWrap:"wrap", gap:"var(--space-3)" }}>
          <Button size="sm" variant="ghost" as="a" href={window.PORTFOLIO_DATA.github} target="_blank">github</Button>
          <Button size="sm" variant="outline" as="a" href={window.PORTFOLIO_DATA.resume} download>résumé ↓</Button>
        </span>}
      />
      <Hero />
      <About />
      <Experience />
      <Projects />
      <Skills />
      <Contact />
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
